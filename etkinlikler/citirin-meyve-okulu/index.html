<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çıtır'ın Meyve Okulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Yerleşim: 3B atölye tam ekran; solda Çıtır'ın defteri (yan panel), üstte adımlar. Telefonda defter alttan açılır. */
:root{
  --gece:#10262b;           /* Çıtır'ın ekranı ve beyin panosu */
  --defter:#fffdf6;         /* yan panel zemini */
  --defter-2:#f1f6f3;
  --murekkep:#1c2b33;
  --soluk:#55656d;
  --cizgi:#d6e2dc;
  --robot:#1f8a8a;
  --robot-koyu:#146266;
  --vurgu:#ff7a3d;
  --elma:#d8433a;
  --limon:#d9a600;
  --muz:#6d56c9;
  --dogru:#2e8b57;
  --yanlis:#c2412d;
  --golge:0 10px 30px rgba(12,28,34,.22);
  --f-baslik:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --f-metin:"Nunito","Verdana","Segoe UI",sans-serif;
  --f-sayi:"JetBrains Mono","Consolas","Courier New",monospace;
  --t-s:clamp(14px,1.02vw,16px);
  --t-m:clamp(16px,1.25vw,19px);
  --t-l:clamp(20px,1.7vw,26px);
  --t-xl:clamp(24px,2.4vw,38px);
  --yan:min(34vw,520px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe6ee;color:var(--murekkep);font-family:var(--f-metin);-webkit-tap-highlight-color:transparent}
#sahne{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--vurgu);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}

#yukleme{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#2a6b6b 0%,#10262b 70%);color:#fff;text-align:center;padding:24px}
#yukleme h1{font-family:var(--f-baslik);font-weight:700;font-size:clamp(34px,5vw,58px);margin:0 0 14px;line-height:1}
#yukleme p{margin:10px 0 0;opacity:.85;font-size:var(--t-m)}
.cubuk{width:min(320px,70vw);height:8px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin:0 auto}
.cubuk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vurgu),#ffc15a);transition:width .3s}
#hata{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#10262b;padding:24px}
#hata .kart{max-width:620px;background:var(--defter);border-radius:14px;padding:26px;box-shadow:var(--golge);font-size:var(--t-m);line-height:1.55}
#hata h2{font-family:var(--f-baslik);margin:0 0 8px;color:var(--yanlis)}

/* yan panel: Çıtır'ın defteri */
#yan{position:fixed;left:0;top:0;bottom:0;width:var(--yan);z-index:10;display:flex;flex-direction:column;background:var(--defter);box-shadow:var(--golge);padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));gap:12px;overflow-y:auto}
.marka h1{font-family:var(--f-baslik);font-weight:700;font-size:var(--t-xl);margin:0;line-height:1.05;text-wrap:balance}
.marka span{display:block;color:var(--soluk);font-size:var(--t-s);font-weight:800;letter-spacing:.05em;margin-top:2px}
nav.adimlar{display:flex;gap:6px;flex-wrap:wrap}
.adim{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 5px;border:2px solid var(--cizgi);border-radius:999px;background:#fff;font-weight:800;font-size:var(--t-s)}
.adim .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--defter-2);font-family:var(--f-sayi);font-size:14px}
.adim[aria-current="step"]{border-color:var(--robot);background:var(--robot);color:#fff}
.adim[aria-current="step"] .no{background:rgba(255,255,255,.22)}
.balon{position:relative;background:var(--defter-2);border:2px solid var(--cizgi);border-radius:16px;padding:12px 14px;font-size:var(--t-m);line-height:1.5}
.balon .kim{display:flex;align-items:center;gap:8px;font-family:var(--f-baslik);font-weight:600;color:var(--robot-koyu);margin-bottom:4px}
.balon .kim i{width:12px;height:12px;border-radius:50%;background:var(--vurgu);box-shadow:0 0 0 3px rgba(255,122,61,.25)}
.balon p{margin:0}
.balon p+p{margin-top:6px}
.balon b{color:var(--robot-koyu)}
.goz{display:grid;gap:4px;background:#fff;border:2px solid var(--cizgi);border-radius:14px;padding:10px 12px 18px}
.goz h3{margin:0 0 2px;font-family:var(--f-baslik);font-weight:600;font-size:var(--t-m);display:flex;gap:8px;align-items:center}
.olcu .ust{display:flex;justify-content:space-between;font-weight:800;font-size:var(--t-s)}
.olcu .ust span:last-child{font-family:var(--f-sayi);font-variant-numeric:tabular-nums}
.olcu{padding-bottom:14px}
.cb{position:relative;height:14px;border-radius:7px;background:var(--cizgi)}
.cb.renk{background:linear-gradient(90deg,hsl(2,78%,52%),hsl(48,92%,55%),hsl(100,55%,45%))}
.cb i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--murekkep);transform:translateX(-50%);transition:left .4s}
.cb .uclar{position:absolute;inset:auto 0 -19px 0;display:flex;justify-content:space-between;font-size:12px;color:var(--soluk)}
#kontrol{display:grid;gap:10px}
.eylem{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:50px;padding:8px 16px;border-radius:14px;border:2px solid var(--murekkep);background:#fff;font-weight:800;font-size:var(--t-m)}
.btn.ana{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.btn.hafif{border-color:var(--cizgi)}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.sepetler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sepet{min-height:74px;border-radius:14px;border:3px solid var(--k);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--f-baslik);font-weight:600;font-size:var(--t-l);padding:6px;line-height:1.1}
.sepet .say{font-family:var(--f-sayi);font-size:13px;color:var(--soluk);font-weight:500}
.sepet:not(:disabled):hover{background:var(--defter-2)}
.karne{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.karne div{background:var(--defter-2);border-radius:12px;padding:6px 10px}
.karne b{display:block;font-family:var(--f-sayi);font-size:var(--t-l);font-variant-numeric:tabular-nums}
.karne span{font-size:13px;color:var(--soluk);font-weight:800}
.sonuc{border-radius:12px;padding:8px 12px;font-weight:800}
.sonuc.d{background:#e2f3e9;color:var(--dogru)}
.sonuc.y{background:#fbe4df;color:var(--yanlis)}
.deney{border:2px solid var(--cizgi);border-radius:14px;padding:10px 12px;display:grid;gap:6px;background:#fff}
.deney[aria-current="true"]{border-color:var(--vurgu)}
.deney h3{margin:0;font-family:var(--f-baslik);font-weight:600;font-size:var(--t-m)}
.deney p{margin:0;font-size:var(--t-s);color:var(--soluk)}
.cg{display:grid;gap:6px}
.cg .sat{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:800;font-size:var(--t-s)}
.cg .ic{height:18px;border-radius:5px;background:var(--cizgi);overflow:hidden}
.cg .ic i{display:block;height:100%;background:var(--robot);width:0;transition:width .8s}
.cg span:last-child{font-family:var(--f-sayi)}
.ozet ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:var(--t-m)}
.ozet li::marker{font-family:var(--f-sayi);color:var(--robot);font-weight:700}
.ozet h2{font-family:var(--f-baslik);font-weight:600;font-size:var(--t-l);margin:0 0 6px}
.gercek{display:grid;gap:8px;margin-top:10px}
.gercek div{background:var(--defter-2);border-radius:12px;padding:8px 12px;font-size:var(--t-s)}
.gercek b{display:block;font-family:var(--f-baslik);font-weight:600;font-size:var(--t-m)}
.kucuk{font-size:var(--t-s);color:var(--soluk);margin:0}
.link{background:none;border:0;padding:0;color:var(--robot-koyu);text-decoration:underline;font-weight:800;font-size:var(--t-s);justify-self:start}

/* sağ üst araçlar */
#araclar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.arac{min-height:46px;padding:6px 14px;border:0;border-radius:12px;background:rgba(16,38,43,.78);color:#fff;font-weight:800;font-size:var(--t-s);display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.arac[aria-pressed="true"]{background:#fff;color:var(--murekkep)}
#bildirim{position:fixed;left:calc(var(--yan) + (100% - var(--yan)) / 2);transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:12;background:rgba(16,38,43,.9);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;font-size:var(--t-s);pointer-events:none;opacity:0;transition:opacity .3s;max-width:calc(100% - var(--yan) - 32px);text-align:center}
#bildirim.gor{opacity:1}

@media (max-width:820px){
  :root{--yan:0px}
  #yan{top:auto;right:0;width:auto;height:52%;border-radius:18px 18px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
  .marka h1{font-size:22px}
  #araclar{top:calc(10px + env(safe-area-inset-top,0px))}
  #bildirim{left:50%;bottom:calc(54% + 10px);max-width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="sahne" tabindex="0" aria-label="Çıtır'ın atölyesi. Beyin panosuna dokunarak hayalî bir meyve sorabilirsin."></canvas>

  <div><h1>Çıtır'ın Meyve Okulu</h1><div class="cubuk"><i id="yukCubuk"></i></div><p id="yukMetin">Atölye hazırlanıyor…</p></div>
</div>

<aside id="yan" aria-label="Çıtır'ın defteri">

  <nav class="adimlar" id="adimlar" aria-label="Adımlar"></nav>
  <div class="balon" id="balon" aria-live="polite"></div>
  <div class="goz" aria-label="Çıtır'ın gördüğü">
    <h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Çıtır'ın gördüğü: yalnızca iki ölçüm</h3>
    <div class="olcu"><div class="ust"><span>Uzunluk</span><span id="gUzun">–</span></div><div class="cb"><i id="gUzunI" style="left:50%"></i><div class="uclar"><span>yuvarlak</span><span>uzun</span></div></div></div>
    <div class="olcu"><div class="ust"><span>Renk</span><span id="gRenk">–</span></div><div class="cb renk"><i id="gRenkI" style="left:50%"></i><div class="uclar"><span>kırmızı</span><span>sarı</span><span>yeşil</span></div></div></div>

</aside>

</div>
<div id="bildirim" role="status" aria-live="polite"></div>

<script>
document.documentElement.lang = 'tr';
/* =====================================================================

window.METIN = {
  adimlar: ["Tanış", "Öğret", "Sına", "Deney yap", "Ne öğrendik?"],
  tanis: [
    "Merhaba, ben <b>Çıtır</b>! Bahçeden gelen meyveleri sepetlere ayırmayı öğrenmek istiyorum: <b>elma</b>, <b>limon</b> ve <b>muz</b>.",
    "Ama henüz hiçbir şey bilmiyorum. Banttan bir meyve getir, tahmin etmeye çalışayım."

  ogretAdim: {

    6: "Artık bir şeyler anlamaya başladım. Birkaç örnek daha gösterir misin?",

  ogretSonra: "Teşekkürler! Bunu beynime ekledim.",

  sinaNeden: (k, sayilar, tahmin) => `Panoda buna en çok benzeyen <b>${k}</b> örneğe baktım: ${sayilar}. Çoğu <b>${tahmin}</b> olduğu için “${tahmin}” dedim.`,
  sinaDogru: "Bildim!",

  sinaIleri: "Beni birkaç kez sınadın. İstediğin kadar devam edebilirsin ya da <b>Deney yap →</b> düğmesiyle deneylere geçebilirsin.",
  hayal: "Bu, panoda hayal ettiğin bir meyve.",
  deneyGiris: "Bilim insanları gibi deney yapalım. Bir deney seç. Dikkat: deney benim beynimi değiştirir.",
  ozetBaslik: "Makine öğrenmesi nasıl çalışır?",
  ozet: [
    "<b>Makine öğrenmesi</b>, bilgisayarın her şeyi tek tek anlatmadan <b>örneklerden öğrenmesidir</b>.",
    "Bilgisayar örneklerin tamamını değil, bazı <b>özelliklerini</b> ölçer. Çıtır yalnızca uzunluğa ve renge baktı.",
    "Her örneğin bir <b>etiketi</b> vardır. Etiketleri insanlar verir. Etiket yanlışsa makine de yanlış öğrenir.",
    "Makine yeni bir şey görünce onu öğrendiği <b>en benzer örneklerle karşılaştırır</b> ve bir <b>tahmin</b> yapar.",
    "Tahmin her zaman doğru değildir. <b>Daha çok</b> ve <b>daha çeşitli</b> örnekler tahminleri iyileştirir."
  ],
  gercek: [
    ["İstenmeyen e-posta", "E-posta uygulaması, insanların “istenmeyen” diye işaretlediği binlerce örnekten öğrenir."],
    ["Fotoğraf albümü", "Telefon, fotoğraflardaki yüzleri benzerliklerine göre gruplar."],
    ["Öneriler", "Video uygulaması, izlediklerine benzeyen videoları önerir."]
  ]
};
</script>

  ray.setFromCamera(fare, camera);
  const hit = ray.intersectObject(D.panoG.children[0], false)[0];
  if (hit) { const l = D.panoG.worldToLocal(hit.point.clone()); const H = D.harita; const s = (l.x - H.x0) / (H.x1 - H.x0), c = (H.y1 - l.y) / (H.y1 - H.y0); if (s >= 0 && s <= 1 && c >= 0 && c <= 1) hayalSor({ tur: 'hayal', s, c }); return; }
  for (const t of TURLER) { const S = D.sepetler[t]; const hs = ray.ray.distanceToPoint(V(S.x, 0.4, S.z)); if (hs < 0.7 && adim === 1) { etiketle(t); return; } }
});

// =====================================================================
//   DERS AKIŞI
// =====================================================================
const DURUM = { dusunuyor: false, mesgul: false };
let adim = 0, karne = { d: 0, y: 0 }, aktifDeney = -1, simdiki = null;
function konus(satirlar, durum = 'normal') { $('#balon').innerHTML = '<div class="kim"><i></i>Çıtır</div>' + (Array.isArray(satirlar) ? satirlar : [satirlar]).map(s => `<p>${s}</p>`).join(''); yuzCiz(durum); }
function bildir(m) { const b = $('#bildirim'); b.textContent = m; b.classList.add('gor'); clearTimeout(bildir.z); bildir.z = setTimeout(() => b.classList.remove('gor'), 4000); }
const btn = (metin, cls, fn, dis) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.innerHTML = metin; b.onclick = fn; if (dis) b.disabled = true; return b; };
const kontrol = $('#kontrol');
function adimBar() { const n = $('#adimlar'); n.innerHTML = ''; M.adimlar.forEach((a, i) => { const b = document.createElement('button'); b.className = 'adim'; b.innerHTML = `<span class="no">${i + 1}</span>${a}`; if (i === adim) b.setAttribute('aria-current', 'step'); b.onclick = () => adimaGit(i); n.appendChild(b); }); }
function adimaGit(i) { adim = i; komsuCiz(null); adimBar(); [tanis, ogret, sina, deney, ozet][i](); }
const sayilarMetni = (t) => TURLER.filter(x => t.ks.some(k => k.h.etiket === x)).map(x => `${t.ks.filter(k => k.h.etiket === x).length} ${tr(AD[x])}`).join(', ');

function tanis() {
  bandaGetir(null); konus(M.tanis); kontrol.innerHTML = '';
  const e = document.createElement('div'); e.className = 'eylem';
  e.append(btn('Bir meyve getir', 'ana', () => {
    simdiki = meyveUret(rastgeleTur());
    bandaGetir(simdiki, '', () => tara(() => {
      if (!hafiza.length) { konus(M.tanisBilmiyor, 'sasir'); e.innerHTML = ''; e.append(btn("Çıtır'a öğret →", 'ana', () => adimaGit(1))); }
      else { const t = tahmin(simdiki); komsuCiz(simdiki, t.ks); konus(`Bence bu bir <b>${tr(AD[t.tur])}</b>. Beynimde ${hafiza.length} örnek var.`, 'mutlu'); }
    }));
  }));
  kontrol.append(e);
}
function etiketle(t) {
  if (!simdiki || DURUM.mesgul) return;
  DURUM.mesgul = true;
  const m = simdiki; simdiki = null;
  const kayit = { s: m.s, c: m.c, etiket: t, gorunum: m.tur };
  animler.push({ tip: 'atis', t: 0 });
  if (bantMeyve) { scene.remove(bantMeyve); bantMeyve = null; }
  sepeteKoy(t, m, true, D.durak.clone());
  const S = D.sepetler[t];
  setTimeout(() => kivilcim(V(S.x, 0.9, S.z), D.haritaXY(m.s, m.c), () => { hafiza.push(kayit); panoGuncelle(); }), AZ ? 200 : 800);
  const n = hafiza.length + 1;
  if (t !== m.tur) konus(M.ogretYanlis(tr(AD[t])), 'dusun');
  else konus(M.ogretAdim[n] || M.ogretSonra, M.ogretAdim[n] ? 'mutlu' : 'normal');
  setTimeout(() => { DURUM.mesgul = false; const ib = $('#sinaIleri'); if (ib) ib.disabled = hafiza.length < 6; if (adim === 1) sonrakiMeyve(); }, AZ ? 300 : 1100);
}
function ogret() {
  kameraGit(KAM.kam, KAM.hedef);
  konus(M.ogret); kontrol.innerHTML = '';
  const sep = document.createElement('div'); sep.className = 'sepetler';
  TURLER.forEach(t => { const b = document.createElement('button'); b.className = 'sepet'; b.style.setProperty('--k', RENK[t]); b.innerHTML = `${AD[t]}<span class="say" data-say="${t}"></span>`; b.setAttribute('aria-label', `${AD[t]} sepetine koy`); b.onclick = () => etiketle(t); sep.append(b); });
  const alt = document.createElement('div'); alt.className = 'eylem';
  const ileri = btn('Beni sına →', 'ana', () => adimaGit(2), hafiza.length < 6); ileri.id = 'sinaIleri';
  alt.append(ileri, btn('Beyni sil', 'hafif', () => { hafizaYukle([]); konus('Beynim silindi. Her şeyi unuttum!', 'sasir'); const ib = $('#sinaIleri'); if (ib) ib.disabled = true; }));
  const hizli = document.createElement('button'); hizli.className = 'link'; hizli.textContent = 'Öğretmen: 12 örneği otomatik ekle';
  hizli.onclick = () => { const yeni = hafiza.slice(); for (let i = 0; i < 12; i++) { const m = meyveUret(TURLER[i % 3]); yeni.push({ s: m.s, c: m.c, etiket: m.tur, gorunum: m.tur }); } hafizaYukle(yeni); konus(M.ogretAdim[12], 'mutlu'); const ib = $('#sinaIleri'); if (ib) ib.disabled = false; };
  kontrol.append(sep, alt, hizli);
  lejantGuncelle(); sonrakiMeyve();
}
function sonrakiMeyve() { simdiki = meyveUret(rastgeleTur()); bandaGetir(simdiki); }
function sina() {
  kameraGit(V(0.6, 3.9, 13.8), V(0.6, 2.3, -0.8));
  if (!hafiza.length) { bandaGetir(null); konus('Beynim boş! Önce bana birkaç örnek öğretmelisin.', 'sasir'); kontrol.innerHTML = ''; kontrol.append(btn('← Öğret', 'ana', () => adimaGit(1))); return; }
  bandaGetir(null); konus(M.sina);
  kontrol.innerHTML = `<div class="karne"><div><b id="kD">${karne.d}</b><span>doğru</span></div><div><b id="kY">${karne.y}</b><span>yanlış</span></div><div><b id="kH">${hafiza.length}</b><span>örnek</span></div></div><div id="sonucYer" style="display:grid;gap:8px"></div>`;
  const e = document.createElement('div'); e.className = 'eylem';
  e.append(btn('Yeni meyve getir', 'ana', yeniSinav), btn('Karneyi sıfırla', 'hafif', () => { karne = { d: 0, y: 0 }; $('#kD').textContent = 0; $('#kY').textContent = 0; }));
  const ileri = btn('Deney yap →', 'ana', () => adimaGit(3)); ileri.id = 'deneyIleri'; ileri.hidden = karne.d + karne.y < SINAV_ESIK;
  e.append(ileri);
  kontrol.append(e);
}
const SINAV_ESIK = 3;
function yeniSinav() {
  if (DURUM.mesgul) return; DURUM.mesgul = true;
  const m = meyveUret(rastgeleTur()); komsuCiz(null); $('#sonucYer').innerHTML = '';
  konus('Bahçeden yeni bir meyve geliyor...', 'normal');
  bandaGetir(m, '', () => { DURUM.dusunuyor = true; konus('Ölçüyorum ve beynime bakıyorum...', 'dusun'); tara(() => setTimeout(() => {
    DURUM.dusunuyor = false; DURUM.mesgul = false;
    const t = tahmin(m); komsuCiz(m, t.ks); const ad = tr(AD[t.tur]); const dogru = t.tur === m.tur;
    if (dogru) karne.d++; else karne.y++; $('#kD').textContent = karne.d; $('#kY').textContent = karne.y;
    const di = $('#deneyIleri'); const ilkKez = di && di.hidden && karne.d + karne.y >= SINAV_ESIK; if (di) di.hidden = karne.d + karne.y < SINAV_ESIK;
    yuzCiz(null, t.tur);
    konus([`Bence bu bir <b>${ad}</b>!`, M.sinaNeden(t.ks.length, sayilarMetni(t), ad), dogru ? M.sinaDogru : M.sinaYanlis], dogru ? 'mutlu' : 'sasir');
    yuzCiz(null, t.tur); setTimeout(() => yuzCiz(dogru ? 'mutlu' : 'sasir'), 2500);
    const s = document.createElement('div'); s.className = 'sonuc ' + (dogru ? 'd' : 'y'); s.textContent = `${dogru ? '✓' : '✗'} Gerçekte: ${AD[m.tur]}`; $('#sonucYer').append(s);
    if (ilkKez) { const n = document.createElement('p'); n.className = 'kucuk'; n.innerHTML = M.sinaIleri; $('#sonucYer').append(n); }
    if (!dogru) { const b = btn(`Bunu “${AD[m.tur]}” olarak öğret`, '', () => { b.disabled = true; hafiza.push({ s: m.s, c: m.c, etiket: m.tur, gorunum: m.tur }); if (bantMeyve) { scene.remove(bantMeyve); bantMeyve = null; } sepeteKoy(m.tur, m, true); panoGuncelle(); $('#kH').textContent = hafiza.length; konus('Teşekkürler! Artık buna benzeyenleri daha iyi bilirim.', 'mutlu'); }); $('#sonucYer').append(b); }
  }, AZ ? 100 : 500)); });
}
function hayalSor(m) {
  gozGuncelle(m);
  if (!hafiza.length) { konus('Beynim boş, bilemem! Önce bana örnek öğret.', 'sasir'); komsuCiz(null); return; }
  const t = tahmin(m); komsuCiz(m, t.ks); const ad = tr(AD[t.tur]);
  konus([M.hayal + ` Bence bu bir <b>${ad}</b>.`, M.sinaNeden(t.ks.length, sayilarMetni(t), ad)], 'dusun');
}

const kayit = (t, m) => ({ s: m.s, c: m.c, etiket: t, gorunum: m.tur });
const DENEYLER = [
  { ad: 'Az örnek mi, çok örnek mi?', aciklama: "Çıtır'ı önce her meyveden 1 örnekle, sonra 10 örnekle eğitip 60 yeni meyveyle sınayalım.",
    calistir(alan) {
      const test = Array.from({ length: 60 }, () => meyveUret(rastgeleTur()));
      const olc = () => test.filter(m => tahmin(m).tur === m.tur).length / test.length;
      hafiza = TURLER.map(t => kayit(t, meyveUret(t, t === 'elma' ? { kirmizi: true } : {}))); const a1 = olc();
      const cok = []; TURLER.forEach(t => { for (let i = 0; i < 10; i++) cok.push(kayit(t, meyveUret(t))); }); hafizaYukle(cok); const a2 = olc();
      alan.innerHTML = `<div class="cg"><div class="sat"><span>3 örnek</span><div class="ic"><i></i></div><span>%${Math.round(a1 * 100)}</span></div><div class="sat"><span>30 örnek</span><div class="ic"><i></i></div><span>%${Math.round(a2 * 100)}</span></div></div><p class="kucuk">60 yeni meyveden doğru bildiklerinin yüzdesi. Panoda 30 örnekli beyni görüyorsun.</p>`;
      requestAnimationFrame(() => { const i = alan.querySelectorAll('.ic i'); i[0].style.width = a1 * 100 + '%'; i[1].style.width = a2 * 100 + '%'; });
      konus([`Az örnekle 60 meyveden <b>${Math.round(a1 * 60)}</b> tanesini bildim, çok örnekle <b>${Math.round(a2 * 60)}</b> tanesini.`, 'Ne kadar çok örnek görürsem o kadar iyi tahmin ederim.'], 'mutlu');
    } },
  { ad: 'Hiç yeşil elma görmezse?', aciklama: "Çıtır'a yalnızca kırmızı elmalar gösterelim. Sonra ona yeşil bir elma soralım.",
    calistir(alan) {
      const l = []; TURLER.forEach(t => { for (let i = 0; i < 8; i++) l.push(kayit(t, meyveUret(t, t === 'elma' ? { kirmizi: true } : {}))); }); hafizaYukle(l);
      const sor = () => { const m = meyveUret('elma', { yesil: true }); bandaGetir(m); const t = tahmin(m); komsuCiz(m, t.ks); return t; };
      const t = sor();
      konus([`Bence bu bir <b>${tr(AD[t.tur])}</b>...`, t.tur === 'elma' ? 'Bildim ama çok zorlandım.' : 'Hiç yeşil elma görmediğim için onu rengi benzeyen meyvelerle karıştırdım.'], t.tur === 'elma' ? 'mutlu' : 'sasir');
      alan.innerHTML = `<p class="kucuk">Makine yalnızca gördüğü örneklerden öğrenir. Örnekler çeşitli değilse bazı şeyleri tanıyamaz. Gerçek hayatta da bir yapay zekâ yalnızca bazı insanların fotoğraflarıyla eğitilirse diğerlerini tanımakta zorlanabilir.</p>`;
      alan.append(btn('Yeşil elma örnekleri ekle ve tekrar sor', 'ana', (ev) => {
        const yeni = hafiza.slice(); for (let i = 0; i < 5; i++) yeni.push(kayit('elma', meyveUret('elma', { yesil: true }))); hafizaYukle(yeni);
        const t2 = sor(); ev.target.disabled = true; konus([`Şimdi bence bu bir <b>${tr(AD[t2.tur])}</b>!`, 'Çeşitli örnekler görünce doğru tahmin ettim.'], 'mutlu');
      }));
    } },
  { ad: 'Yanlış öğretirsek ne olur?', aciklama: 'Muzların çoğunu yanlışlıkla “elma” sepetine koyalım. Sonra Çıtır\'a bir muz soralım.',
    calistir(alan) {
      const l = []; TURLER.forEach(t => { for (let i = 0; i < 8; i++) l.push(kayit((t === 'muz' && i < 6) ? 'elma' : t, meyveUret(t))); }); hafizaYukle(l);
      const m = meyveUret('muz'); bandaGetir(m); const t = tahmin(m); komsuCiz(m, t.ks);
      konus([`Bence bu bir <b>${tr(AD[t.tur])}</b>!`, 'Bana muzları elma diye öğrettin. Ben de öyle öğrendim.'], 'dusun');
      alan.innerHTML = `<p class="kucuk">Elma sepetinde muzlar var ve panoda muz şeklindeki noktaların çoğu kırmızı halkalı. Etiketler yanlışsa makine de yanlış öğrenir; etiketleri veren insanların dikkatli olması gerekir.</p>`;
    } }
];
function deney() {
  kameraGit(KAM.kam, KAM.hedef);
  bandaGetir(null); konus(M.deneyGiris); kontrol.innerHTML = '';
  DENEYLER.forEach((x, i) => {
    const kart = document.createElement('div'); kart.className = 'deney'; if (i === aktifDeney) kart.setAttribute('aria-current', 'true');
    kart.innerHTML = `<h3>${x.ad}</h3><p>${x.aciklama}</p>`;
    const alan = document.createElement('div'); alan.className = 'sonucAlan'; alan.style.cssText = 'display:grid;gap:8px';
    kart.append(btn('Deneyi başlat', 'ana', () => { aktifDeney = i; document.querySelectorAll('.deney').forEach(k => k.removeAttribute('aria-current')); kart.setAttribute('aria-current', 'true'); document.querySelectorAll('.sonucAlan').forEach(a => a.innerHTML = ''); x.calistir(alan); const oi = $('#ozetIleri'); if (oi) oi.hidden = false; }), alan);
    kontrol.append(kart);
  });
  const e = document.createElement('div'); e.className = 'eylem';
  const ileri = btn('Ne öğrendik? →', 'ana', () => adimaGit(4)); ileri.id = 'ozetIleri'; ileri.hidden = aktifDeney < 0;
  e.append(ileri); kontrol.append(e);
}
function ozet() {
  kameraGit(V(-1.5, 5.2, 16.5), V(0.5, 2.3, -0.6));
  bandaGetir(null); konus('Beni eğittiğin için teşekkürler! Birlikte öğrendiklerimize bir bakalım.', 'mutlu');
  kontrol.innerHTML = `<div class="ozet"><h2>${M.ozetBaslik}</h2><ol>${M.ozet.map(x => `<li>${x}</li>`).join('')}</ol><div class="gercek">${M.gercek.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join('')}</div></div>`;
  kontrol.append(btn('Baştan başla', 'hafif', () => { hafizaYukle([]); karne = { d: 0, y: 0 }; aktifDeney = -1; adimaGit(0); }));
}

$('#dBolge').addEventListener('click', (e) => { const a = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(a)); panoGuncelle(); });
$('#dSifirla').addEventListener('click', () => kameraGit(KAM.kam, KAM.hedef, 1));
$('#dKalite').addEventListener('click', (e) => { HAFIF = !HAFIF; renderer.setPixelRatio(Math.min(devicePixelRatio, HAFIF ? 1 : 1.75)); renderer.shadowMap.enabled = !HAFIF || true; gunes.shadow.mapSize.set(HAFIF ? 1024 : 2048, HAFIF ? 1024 : 2048); if (gunes.shadow.map) { gunes.shadow.map.dispose(); gunes.shadow.map = null; } e.currentTarget.textContent = 'Kalite: ' + (HAFIF ? 'Hafif' : 'Yüksek'); boyutla(); });

try {
  await kur();
  ilerle(0.9, 'Beyin panosu açılıyor…'); await bekle();
  DAR = innerWidth <= 820; camera.position.copy(kamPos(KAM.kam, KAM.hedef)); controls.target.copy(KAM.hedef); camera.lookAt(KAM.hedef);
  $('#dKalite').textContent = 'Kalite: ' + (HAFIF ? 'Hafif' : 'Yüksek');
  boyutla(); panoGuncelle(); adimaGit(0);
  ilerle(1, 'Hazır!');
  requestAnimationFrame(dongu);
  setTimeout(() => $('#yukleme').hidden = true, 250);
  window.__citir = { adimaGit, hafiza: () => hafiza, etiketle, simdiki: () => simdiki };
  window.__hazir = true;
} catch (e) {
  console.error(e);
  hataGoster('Atölye kurulurken bir sorun çıktı', `<p>Sayfayı yenilemeyi dene. Sorun sürerse adresin sonuna <b>?kalite=hafif</b> ekleyebilirsin.</p><p style="font-size:14px;color:#55656d">Teknik ayrıntı: ${String(e.message || e)}</p>`);
}
</script>
