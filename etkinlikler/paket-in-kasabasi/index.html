<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paket'in Kasabası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Yerleşim: manzara tam ekran; başlık sol üstte, kontroller sağda, Paket'in mektup kâğıdı sol altta, pul biçimli duraklar altta. */
:root{
  --murekkep:#1d2836;        /* koyu lacivert mürekkep */
  --kagit:#fbf6ea;           /* mektup kâğıdı */
  --kagit-kenar:#e6d9bd;
  --pul:#c8412c;             /* posta kırmızısı */
  --deniz:#157a7a;           /* liman turkuazı */
  --pirinc:#b8862b;          /* pirinç anahtar */
  --soluk:#5a6370;
  --cam:rgba(22,32,44,.78);  /* kontrol rayı zemini */
  --cam-acik:rgba(255,255,255,.14);
  --beyaz:#ffffff;
  --golge:0 10px 30px rgba(10,18,28,.28);
  --f-baslik:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif;
  --f-metin:"Lexend","Verdana","Segoe UI",sans-serif;
  --f-damga:"Courier Prime","Courier New",monospace;
  --t-kucuk:clamp(13px,1.05vw,15px);
  --t-metin:clamp(15px,1.25vw,19px);
  --t-baslik:clamp(20px,1.9vw,28px);
  --dugme:clamp(46px,3.6vw,58px);
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#0f1a24;color:var(--murekkep);font-family:var(--f-metin);-webkit-tap-highlight-color:transparent}
#sahne{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pirinc);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- yükleme ve hata ---------- */
#yukleme{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#2b4a5c 0%,#12202c 70%);color:var(--kagit);text-align:center;padding:24px}
#yukleme .kutu{display:grid;gap:16px;justify-items:center;max-width:520px}
#yukleme h1{font-family:var(--f-baslik);font-weight:800;font-size:clamp(34px,5vw,56px);margin:0;line-height:1;text-wrap:balance}
#yukleme p{margin:0;font-size:var(--t-metin);opacity:.85}
.cubuk{width:min(320px,70vw);height:8px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.cubuk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pirinc),#e8c26a);transition:width .3s}
.damga{font-family:var(--f-damga);letter-spacing:.12em;text-transform:uppercase;font-size:var(--t-kucuk)}
#hata{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#12202c;padding:24px}
#hata .mektup{max-width:620px;background:var(--kagit);border-radius:6px;padding:28px 28px 24px;box-shadow:var(--golge);font-size:var(--t-metin);line-height:1.55}
#hata h2{font-family:var(--f-baslik);margin:0 0 8px;font-size:var(--t-baslik);color:var(--pul)}

/* ---------- başlık ---------- */
#baslik{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:10;color:var(--beyaz);text-shadow:0 2px 12px rgba(0,0,0,.45);pointer-events:none;max-width:48vw}
#baslik h1{font-family:var(--f-baslik);font-weight:800;margin:0;font-size:clamp(24px,2.6vw,40px);line-height:1}
#baslik .alt{font-family:var(--f-damga);font-size:var(--t-kucuk);letter-spacing:.08em;opacity:.95;margin-top:4px}

/* ---------- atmosfer seçici ---------- */
#atmosfer{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--cam);box-shadow:var(--golge);backdrop-filter:blur(6px)}
#atmosfer button{min-height:var(--dugme);padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--kagit);display:flex;align-items:center;gap:8px;font-size:var(--t-kucuk);font-weight:500}
#atmosfer button[aria-pressed="true"]{background:var(--kagit);color:var(--murekkep)}
#atmosfer svg{width:22px;height:22px}

/* ---------- kontrol rayı ---------- */
#ray{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(var(--dugme) + 36px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px;background:var(--cam);box-shadow:var(--golge);backdrop-filter:blur(6px);max-height:calc(100% - var(--dugme) - 200px);overflow-y:auto}
.rd{width:calc(var(--dugme) + 26px);min-height:var(--dugme);border:0;border-radius:10px;background:transparent;color:var(--kagit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:1.1;padding:6px 2px}
.rd svg{width:24px;height:24px}
.rd:hover{background:var(--cam-acik)}
.rd[aria-pressed="true"]{background:var(--kagit);color:var(--murekkep)}
.rd .ayrac{display:none}
#ray hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:2px 6px;width:auto}
#menuDugme{display:none}

/* ---------- Paket'in mektup paneli ---------- */
#panel{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(var(--dugme) + 44px + env(safe-area-inset-bottom,0px));z-index:12;width:min(560px,calc(100% - 140px));max-height:calc(100% - 210px);display:flex;flex-direction:column;background:var(--kagit);border-radius:8px;box-shadow:var(--golge);overflow:hidden}
#panel::before{content:"";display:block;height:8px;flex:none;background:repeating-linear-gradient(135deg,var(--pul) 0 14px,var(--kagit) 14px 20px,#2c5aa0 20px 34px,var(--kagit) 34px 40px)}
.p-ust{display:flex;gap:14px;align-items:center;padding:14px 16px 6px 16px}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:#d8e8e8 center/cover no-repeat;border:3px solid var(--beyaz);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.p-kim{flex:1;min-width:0}
.p-kim .damga{color:var(--pul);font-weight:700}
.p-kim h2{font-family:var(--f-baslik);font-weight:800;margin:0;font-size:var(--t-baslik);line-height:1.1;text-wrap:balance}
#panelKapat{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:26px;line-height:1;color:var(--soluk)}
#panelKapat:hover{background:rgba(0,0,0,.06)}
.p-govde{padding:4px 18px 16px 18px;overflow-y:auto;font-size:var(--t-metin);line-height:1.55;display:grid;gap:10px}
.p-govde p{margin:0;max-width:62ch}
.sence{border-left:4px solid var(--deniz);padding:6px 0 6px 12px;font-weight:600;color:var(--deniz)}
.aciklama{background:rgba(21,122,122,.08);border-radius:6px;padding:10px 12px}
.durum{font-weight:600}
.not{font-size:var(--t-kucuk);color:var(--soluk)}
.p-alt{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 16px 18px}
.btn{min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--murekkep);background:transparent;font-weight:600;font-size:var(--t-kucuk)}
.btn.ana{background:var(--murekkep);color:var(--kagit)}
.btn:hover{transform:translateY(-1px)}
.secenekler{display:grid;gap:8px}
.secenek{text-align:left;min-height:56px;padding:12px 14px;border-radius:10px;border:2px solid var(--kagit-kenar);background:var(--beyaz);font-size:var(--t-metin);line-height:1.35;display:flex;gap:12px;align-items:center}
.secenek:hover{border-color:var(--murekkep)}
.secenek .harf{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--murekkep);color:var(--kagit);font-family:var(--f-damga);font-weight:700}
.secenek.secildi{border-color:var(--deniz);background:#eef7f6}
.secenek.sifre{font-family:var(--f-damga);font-weight:700}
.yorum{background:#fff;border:2px dashed var(--kagit-kenar);border-radius:8px;padding:10px 12px}
#panelKucuk{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(var(--dugme) + 44px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 16px 6px 6px;border:0;border-radius:40px;background:var(--kagit);box-shadow:var(--golge);font-weight:600;font-size:var(--t-kucuk)}
#panelKucuk .avatar{width:42px;height:42px;border-width:2px}
.lejant{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-kucuk)}
.lejant span::before{content:"";display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}

/* ---------- pul biçimli duraklar ---------- */
#duraklar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;gap:8px;padding:6px;border-radius:14px;background:var(--cam);box-shadow:var(--golge);backdrop-filter:blur(6px);max-width:calc(100% - 32px);overflow-x:auto}
.pul{flex:none;position:relative;min-width:calc(var(--dugme) + 52px);min-height:var(--dugme);border:0;padding:5px;background:var(--kagit);color:var(--murekkep);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  -webkit-mask:radial-gradient(circle at 3.5px 3.5px,transparent 2.1px,#000 2.6px) -3.5px -3.5px/7px 7px,linear-gradient(#000,#000) content-box;mask:radial-gradient(circle at 3.5px 3.5px,transparent 2.1px,#000 2.6px) -3.5px -3.5px/7px 7px,linear-gradient(#000,#000) content-box}
.pul>span{padding:0 8px}
.pul .no{font-family:var(--f-damga);font-size:12px;font-weight:700;color:var(--pul)}
.pul .ad{font-family:var(--f-baslik);font-weight:700;font-size:var(--t-kucuk);line-height:1.05;white-space:nowrap}
.pul[aria-current="true"]{background:var(--pirinc);color:var(--beyaz)}
.pul[aria-current="true"] .no{color:var(--beyaz)}
.pul.gezildi::after{content:"";position:absolute;right:6px;top:6px;width:16px;height:16px;border-radius:50%;border:2px solid var(--deniz);opacity:.8}

/* ---------- mektup (oltalama) ve kaplamalar ---------- */
.kaplama{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;background:rgba(10,18,28,.45);padding:16px;overflow-y:auto}
.kaplama>*{margin:auto 0;flex:none}
.olta{position:relative;width:min(560px,100%);background:#fffdf7;border-radius:4px;box-shadow:var(--golge);padding:26px 26px 20px;font-size:var(--t-metin);line-height:1.5;transform:rotate(-.6deg)}
.olta .muhur{position:absolute;right:22px;top:18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#d4553f 55%,#a83522 56%);color:#fff;display:grid;place-items:center;font-family:var(--f-baslik);font-weight:800;font-size:13px;transform:rotate(17deg);border:0;box-shadow:0 2px 0 #7d2517}
.olta .satir{font-family:var(--f-damga);font-size:var(--t-kucuk);margin:0 0 4px}
.olta h3{font-family:var(--f-baslik);margin:12px 0 8px;font-size:var(--t-baslik);color:#b1291a;padding-right:90px}
.ipucu{background:transparent;border:0;padding:0 2px;border-bottom:2px dotted #b98b2e;font:inherit;color:inherit;text-align:left}
.ipucu.bulundu{background:#ffe8a3;border-bottom-color:transparent}
.muhur.bulundu{outline:4px solid #ffd35a}
.olta .bilgi{margin-top:14px;background:#f3efe2;border-radius:6px;padding:10px 12px;min-height:3em;font-size:var(--t-kucuk)}
.olta .alt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.gunluk{width:min(680px,100%);background:var(--kagit);border-radius:8px;box-shadow:var(--golge);overflow:hidden}
.gunluk::before{content:"";display:block;height:10px;background:repeating-linear-gradient(135deg,var(--pul) 0 14px,var(--kagit) 14px 20px,#2c5aa0 20px 34px,var(--kagit) 34px 40px)}
.gunluk .ic{padding:20px 24px 22px;display:grid;gap:12px}
.gunluk h2{font-family:var(--f-baslik);margin:0;font-size:clamp(26px,3vw,36px);line-height:1}
.gunluk ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.gunluk li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding-bottom:10px;border-bottom:1px dashed var(--kagit-kenar)}
.gunluk li .no{grid-row:span 3;font-family:var(--f-damga);font-weight:700;color:var(--pul);font-size:20px}
.gunluk li b{font-family:var(--f-baslik);font-size:var(--t-metin)}
.gunluk li .sec{font-size:var(--t-kucuk)}
.gunluk li .hat{font-size:var(--t-kucuk);color:var(--deniz);font-weight:600}
.gunluk .dugmeler{display:flex;gap:8px;flex-wrap:wrap}
.foto{width:min(900px,100%);background:var(--kagit);border-radius:8px;box-shadow:var(--golge);padding:14px;display:grid;gap:10px}
.foto img{width:100%;border-radius:4px;display:block}
.foto .dugmeler{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bildirim{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--murekkep);color:var(--kagit);padding:10px 18px;border-radius:30px;font-size:var(--t-kucuk);box-shadow:var(--golge);pointer-events:none;opacity:0;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
#bildirim.gor{opacity:1}
#arayuzGoster{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;min-height:48px;padding:0 16px;border:0;border-radius:24px;background:var(--cam);color:var(--kagit);font-size:var(--t-kucuk)}
body.gizli #baslik,body.gizli #atmosfer,body.gizli #ray,body.gizli #panel,body.gizli #panelKucuk,body.gizli #duraklar{display:none!important}

/* ---------- dar ekran ---------- */
@media (max-width:760px){
  #baslik{max-width:calc(100% - 90px)}
  #atmosfer{top:auto;bottom:calc(var(--dugme) + 30px + env(safe-area-inset-bottom,0px));right:16px;display:none}
  #menuDugme{display:flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:14;width:var(--dugme);height:var(--dugme);border:0;border-radius:12px;background:var(--cam);color:var(--kagit);align-items:center;justify-content:center}
  #menuDugme svg{width:26px;height:26px}
  #ray{display:none;top:calc(var(--dugme) + 20px + env(safe-area-inset-top,0px));max-height:calc(100% - var(--dugme) - 120px);flex-direction:row;flex-wrap:wrap;width:calc(100% - 32px);justify-content:center;right:16px}
  #ray hr{display:none}
  body.menu #ray{display:flex}
  body.menu #atmosfer{display:flex;top:calc(var(--dugme) + 20px + env(safe-area-inset-top,0px));bottom:auto;left:16px;right:16px;justify-content:center}
  body.menu #ray{top:calc(var(--dugme)*2 + 40px + env(safe-area-inset-top,0px))}
  #panel{left:8px;right:8px;width:auto;bottom:calc(var(--dugme) + 30px + env(safe-area-inset-bottom,0px));max-height:46%}
  .avatar{width:48px;height:48px}
  .p-ust{padding:10px 12px 4px}
  .p-govde{padding:2px 14px 12px}
  .p-alt{padding:0 14px 12px}
  #duraklar{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;transform:none;max-width:none}
  .pul{min-width:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="sahne" tabindex="0" aria-label="Paket'in Kasabası üç boyutlu sahnesi. Sürükleyerek etrafa bak, tekerlek ya da iki parmakla yakınlaştır."></canvas>

<div id="yukleme" role="status" aria-live="polite">
  <div class="kutu">
    <span class="damga">Bilişim Teknolojileri ve Yazılım · Dijital Vatandaşlık</span>
    <h1>Paket'in Kasabası</h1>
    <div class="cubuk"><i id="yukCubuk"></i></div>
    <p id="yukMetin">Posta çantası hazırlanıyor…</p>
  </div>
</div>
<div id="hata" hidden><div class="mektup"><h2 id="hataBaslik"></h2><div id="hataMetin"></div></div></div>

<header id="baslik">
  <h1>Paket'in Kasabası</h1>
  <div class="alt">DİJİTAL VATANDAŞLIK · 5–6. SINIF</div>
</header>

<button id="menuDugme" aria-label="Menüyü aç" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<div id="atmosfer" role="group" aria-label="Atmosfer">
  <button data-atm="gunduz" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Gündüz</button>
  <button data-atm="aksam" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Akşam</button>
  <button data-atm="sis" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h14M6 12h15M3 16h12M8 20h10"/></svg>Söylenti Sisi</button>
</div>

<nav id="ray" aria-label="Kontroller">
  <button class="rd" id="dAg" aria-pressed="false" title="Mesajların yollarını göster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="17" r="2.2"/><circle cx="12" cy="6" r="2.2"/><path d="M6.5 15.3 10.6 7.8M13.4 7.8l4.1 7.5M7.3 17h9.4"/></svg>Ağ Katmanı</button>
  <button class="rd" id="dTur" aria-pressed="false" title="Paket duraklar arasında sırayla gezsin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span>Tur</span></button>
  <button class="rd" id="dSes" aria-pressed="false" title="Dalga, martı ve kasaba sesleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="dalga" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><span>Ses kapalı</span></button>
  <button class="rd" id="dKalite" title="Görüntü kalitesi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg><span>Yüksek</span></button>
  <hr>
  <button class="rd" id="dSifirla" title="Bu durağın görünümüne dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>Görünümü sıfırla</button>
  <button class="rd" id="dFoto" title="Anlık görüntüyü kaydet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Görüntü kaydet</button>
  <button class="rd" id="dGizle" title="Arayüzü gizle (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 20 20 4"/></svg>Arayüzü gizle</button>
  <button class="rd" id="dBastan" title="Bütün kararları sıfırla ve baştan başla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16M9 12l10-7v14z"/></svg>Baştan başla</button>
</nav>

<section id="panel" aria-live="polite">
  <div class="p-ust">
    <div class="avatar" aria-hidden="true"></div>

const aktifKuslar = [];
function kusUcur(a, b, o = {}) {

}
function kuslariGuncelle(dt, t) {
  for (let i = aktifKuslar.length - 1; i >= 0; i--) {

    if (q.dus) {
      q.k.position.y = Math.max(q.zemin, q.k.position.y - dt * 2.2); q.k.rotation.z += dt * 2; q.k.rotation.x = Math.min(1.5, q.k.rotation.x + dt * 1.5);

    } else {
      // havada daire çiz
      q.faz = (q.faz || 0) + dt * 0.8; q.k.position.set(q.b.x + Math.cos(q.faz) * 1.2, q.b.y + Math.sin(q.faz * 2) * 0.2, q.b.z + Math.sin(q.faz) * 1.2); q.k.rotation.y = -q.faz;

}

function boyutla() {

// Geniş ekranda sahnenin odağını Paket'in panelinden sağa kaydırır.
let kayma = 0;
function kaymaGuncelle(dt) {

}
addEventListener('resize', boyutla);
const saat = new THREE.Clock();
let zaman = 0;
function dongu() {

  atmGuncelle(dt);
  paketGuncelle(dt, zaman);
  kameraGuncelle(dt);
  kaymaGuncelle(dt);
  if (!K.aktif) controls.update();

  }

  // oturan figürün yüksekliği

  for (const m of canlilar.martilar) { const u = m.userData; const a = zaman * u.v + u.f; m.position.set(u.cx + Math.cos(a) * u.r, u.h + Math.sin(zaman * 0.7 + u.f) * 1.2, u.cz + Math.sin(a) * u.r); m.rotation.y = -a + (u.v > 0 ? 0 : Math.PI); m.rotation.z = Math.sin(zaman * 3 + u.f) * 0.15; m.scale.y = 1 + Math.sin(zaman * 5 + u.f) * 0.25; }

    if (o.userData.buyume && o.count < o.userData.hedef) { o.userData.acc = (o.userData.acc || 0) + dt * 18; const n = Math.floor(o.userData.acc); if (n) { o.count = Math.min(o.userData.hedef, o.count + n); o.userData.acc -= n; } }
    if (o.userData.zipla) { o.position.y += Math.sin(zaman * 3) * 0.004; o.rotation.y += dt; }
  }
  // notlar
  for (const n of notlar) { if (n.buyu && n.m.scale.x < 1) n.m.scale.setScalar(Math.min(1, n.m.scale.x + dt * 3)); if (n.uc) { n.m.position.addScaledVector(n.v, dt); n.m.rotation.z += dt * 3; n.m.material.transparent = true; n.m.material.opacity = Math.max(0, (n.m.material.opacity ?? 1) - dt * 0.4); } }
  // vurgu nabzı
  for (const v of vurgu.list) { v.userData.parla.opacity = 0.35 + Math.sin(zaman * 4) * 0.25; if (v.userData.halka) v.scale.setScalar(1 + Math.sin(zaman * 3) * 0.05); }
  // saat kulesi
  const gercek = new Date(); let saatD = D.kule.hedefSaat ?? (gercek.getHours() + gercek.getMinutes() / 60);
  D.kule.saatSimdi = D.kule.saatSimdi == null ? saatD : lerp(D.kule.saatSimdi, saatD, Math.min(1, dt * 1.5));
  const ss = D.kule.saatSimdi; D.kule.yelkovan.forEach(y => y.rotation.z = -(ss % 1) * Math.PI * 2); D.kule.akrep.forEach(y => y.rotation.z = -((ss % 12) / 12) * Math.PI * 2);
  composer.render();

}
